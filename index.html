<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>Oficina 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: arquivo de pranchas técnicas. Cabeçalho de prancheta, grade de fichas numeradas na ordem em que foram feitas, bancada de inspeção em tela cheia ao abrir uma. */
:root {
  --paper: #EEEEEA;
  --sheet: #FAFAF7;
  --ink: #17191C;
  --ink-2: #5C6168;
  --rule: #D3D4CF;
  --signal: #D42A20;
  --signal-ink: #FFFFFF;
  --ok: #2F7D4F;
  --warn: #B7791F;
  --spec: #3D63A8;
  --bad: #A23B3B;
  --shadow: 0 1px 0 rgba(23,25,28,.06), 0 8px 24px -14px rgba(23,25,28,.35);
  --studio: #E9E9E5; /* o estúdio claro dos objetos, igual nos dois temas */
  --studio-ink: #5C6168;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121417; --sheet: #1B1E22; --ink: #ECEDEA; --ink-2: #9EA3AA; --rule: #2E3238;
    --signal: #F0463B; --signal-ink: #FFFFFF; --ok: #5FB884; --warn: #E0A84A; --spec: #7C9BE0; --bad: #E07A7A;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121417; --sheet: #1B1E22; --ink: #ECEDEA; --ink-2: #9EA3AA; --rule: #2E3238;
  --signal: #F0463B; --signal-ink: #FFFFFF; --ok: #5FB884; --warn: #E0A84A; --spec: #7C9BE0; --bad: #E07A7A;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 28px; }

/* Cabeçalho */
.mast { display: grid; grid-template-columns: 1fr auto; gap: 20px 32px; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
.mast h1 { font: 700 clamp(44px, 8vw, 84px)/.88 var(--display); letter-spacing: -.01em; margin: 0; text-transform: uppercase; }
.mast h1 b { color: var(--signal); font-weight: 700; }
.mast p { margin: 10px 0 0; max-width: 58ch; color: var(--ink-2); }
.stamp { display: grid; grid-template-columns: auto auto; gap: 2px 18px; font: 500 12px/1.5 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.stamp dt { color: var(--ink-2); }
.stamp dd { margin: 0; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

/* Filtros */
.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 9px 12px; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 2px; cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { opacity: .6; margin-left: 4px; }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search input { width: 100%; font: 14px var(--body); padding: 9px 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 2px; }
.search input:focus { outline: 2px solid var(--signal); outline-offset: 1px; border-color: transparent; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* Grade de fichas */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.card { background: var(--sheet); box-shadow: var(--shadow); border-radius: 3px; display: grid; grid-template-rows: auto 1fr; text-align: left; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; overflow: hidden; transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1); }
.card:hover { transform: translateY(-3px); }
.card:hover .thumb img { transform: scale(1.03); }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--paper); overflow: hidden; border-bottom: 1px solid var(--rule); }
.thumb img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(0.16, 1, 0.3, 1); }
.thumb .noimg { position: absolute; inset: 0; display: grid; place-items: center; font: 500 12px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
.plate { z-index: 2; position: absolute; left: 0; top: 0; background: var(--ink); color: var(--paper); font: 500 11px/1 var(--mono); letter-spacing: .08em; padding: 7px 9px; }
.meta { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.meta h2 { font: 600 24px/1.05 var(--display); margin: 0; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
.meta p { margin: 0; color: var(--ink-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.tag { border: 1px solid var(--rule); padding: 5px 7px; border-radius: 2px; color: var(--ink); }
.via { display: inline-flex; gap: 6px; align-items: center; }
.via::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.via.real { color: var(--ok); } .via.viavel { color: var(--warn); } .via.especulativo { color: var(--spec); } .via.inviavel { color: var(--bad); }
.date { margin-left: auto; font-variant-numeric: tabular-nums; }
.empty { padding: 48px 20px; text-align: center; color: var(--ink-2); border: 1px dashed var(--rule); border-radius: 3px; }

/* Bancada de inspeção */
.bench { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bench-bar { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 2px solid var(--ink); background: var(--sheet); min-width: 0; }
.bench-bar .t { font: 700 22px/1 var(--display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.bench-bar .t small { font: 500 11px var(--mono); color: var(--signal); letter-spacing: .08em; margin-right: 10px; vertical-align: middle; }
.btn { font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 2px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.solid { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.solid:hover { filter: brightness(1.08); background: var(--signal); color: var(--signal-ink); }
.stage { position: relative; background: var(--studio); min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.stage .loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--studio-ink); pointer-events: none; }
.sheet { overflow-y: auto; background: var(--sheet); border-left: 1px solid var(--rule); padding: 20px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.sheet h3 { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); margin: 0 0 8px; }
.sheet p { margin: 0; }
.spec { width: 100%; border-collapse: collapse; font-size: 13px; }
.spec th, .spec td { text-align: left; vertical-align: top; padding: 7px 0; border-top: 1px solid var(--rule); }
.spec th { font: 500 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); width: 42%; padding-right: 10px; }
.verdict { border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; display: grid; gap: 6px; }
.verdict .via { font: 600 13px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.verdict p { font-size: 14px; color: var(--ink-2); }
.ask { font-size: 13px; color: var(--ink-2); border-left: 2px solid var(--signal); padding-left: 10px; }

@media (max-width: 860px) {
  .bench { grid-template-columns: 1fr; grid-template-rows: auto minmax(52vh, 1fr) auto; overflow-y: auto; }
  .sheet { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  .mast { grid-template-columns: 1fr; }
  .stamp dd { text-align: left; }
  .bench-bar .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card, .thumb img { transition: none; } }
</style>

<div class="wrap" id="home">
  <header class="mast">
    <div>
      <h1>Oficina <b>3D</b></h1>
      <p>Arquivo das máquinas, robôs e invenções que a gente desmonta peça por peça. Cada ficha abre o objeto funcionando: dá para girar, cortar, isolar a peça que trabalha e ler os números reais.</p>
    </div>
    <dl class="stamp" aria-label="Resumo do arquivo">
      <dt>Objetos</dt><dd id="s-total">—</dd>
      <dt>Último</dt><dd id="s-last">—</dd>
      <dt>Atualizado</dt><dd id="s-upd">—</dd>
    </dl>
  </header>

  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por categoria"></div>
    <label class="search"><span hidden>Buscar</span><input id="q" type="search" placeholder="Buscar por nome ou peça…" autocomplete="off"></label>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<section class="bench" id="bench" hidden aria-modal="true" role="dialog" aria-labelledby="b-title">
  <div class="bench-bar">
    <button class="btn" id="b-back" type="button">← Arquivo</button>
    <div class="t" id="b-title"></div>
    <button class="btn hide-sm" id="b-full" type="button">Tela cheia</button>
    <a class="btn solid" id="b-open" target="_blank" rel="noopener">Abrir sozinho</a>
  </div>
  <div class="stage" id="stage"><div class="loading">Montando as peças…</div></div>
  <aside class="sheet" id="b-sheet"></aside>
</section>

<script>
const CAT = {
  maquina: 'Máquina', veiculo: 'Veículo', robo: 'Robô', animal: 'Animal-robô',
  humanoide: 'Humanoide', objeto: 'Objeto', invencao: 'Invenção'
};
const VIA = { real: 'Existe de verdade', viavel: 'Viável', especulativo: 'Especulativo', inviavel: 'Inviável hoje' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (d) => { if (!d) return '—'; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };

let DATA = [], filter = 'todos', query = '';
try { filter = localStorage.getItem('of3d-filter') || 'todos'; } catch (e) {}

function renderChips() {
  const counts = {};
  DATA.forEach((o) => counts[o.categoria] = (counts[o.categoria] || 0) + 1);
  const keys = ['todos', ...Object.keys(CAT).filter((k) => counts[k])];
  if (!keys.includes(filter)) filter = 'todos';
  $('#chips').innerHTML = keys.map((k) =>
    `<button type="button" class="chip" data-k="${k}" aria-pressed="${k === filter}">${k === 'todos' ? 'Todos' : CAT[k]}<span class="n">${k === 'todos' ? DATA.length : counts[k]}</span></button>`
  ).join('');
}

function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = DATA.filter((o) => (filter === 'todos' || o.categoria === filter) &&
    (!q || [o.nome, o.resumo, o.id, ...(o.dados || []).flat()].join(' ').toLowerCase().includes(q)));
  if (!list.length) {
    $('#grid').innerHTML = `<div class="empty">Nada por aqui com esse filtro. Limpe a busca ou escolha outra categoria.</div>`;
    return;
  }
  $('#grid').innerHTML = list.map((o) => `
    <button type="button" class="card" data-id="${esc(o.id)}" aria-label="Abrir ${esc(o.nome)}">
      <div class="thumb">
        ${o.miniatura ? `<img src="${esc(o.miniatura)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        <span class="noimg">${esc(o.id)}</span>
        <span class="plate">${esc(o.id)}</span>
      </div>
      <div class="meta">
        <h2>${esc(o.nome)}</h2>
        <p>${esc(o.resumo)}</p>
        <div class="row">
          <span class="tag">${esc(CAT[o.categoria] || o.categoria)}</span>
          ${o.viabilidade ? `<span class="via ${esc(o.viabilidade.nivel)}">${esc(VIA[o.viabilidade.nivel] || o.viabilidade.nivel)}</span>` : ''}
          <span class="date">${fmtDate(o.criado)}</span>
        </div>
      </div>
    </button>`).join('');
}

function openBench(o) {
  $('#b-title').innerHTML = `<small>${esc(o.id)}</small>${esc(o.nome)}`;
  $('#b-open').href = o.arquivo;
  const stage = $('#stage');
  stage.querySelectorAll('iframe').forEach((f) => f.remove());
  stage.querySelector('.loading').hidden = false;
  const f = document.createElement('iframe');
  f.title = o.nome; f.src = o.arquivo; f.allow = 'fullscreen';
  f.addEventListener('load', () => { stage.querySelector('.loading').hidden = true; });
  stage.appendChild(f);
  const dados = (o.dados || []).map(([k, v]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  $('#b-sheet').innerHTML = `
    <div><h3>O que é</h3><p>${esc(o.resumo)}</p></div>
    ${o.como_funciona ? `<div><h3>Como funciona</h3><p>${esc(o.como_funciona)}</p></div>` : ''}
    ${dados ? `<div><h3>Ficha técnica</h3><table class="spec"><tbody>${dados}</tbody></table></div>` : ''}
    ${o.viabilidade ? `<div class="verdict"><h3>Dá para existir?</h3><span class="via ${esc(o.viabilidade.nivel)}">${esc(VIA[o.viabilidade.nivel] || o.viabilidade.nivel)}</span><p>${esc(o.viabilidade.nota)}</p></div>` : ''}
    ${o.pedido ? `<div><h3>Pedido</h3><p class="ask">${esc(o.pedido)}</p></div>` : ''}
    <div class="row"><span class="tag">${esc(CAT[o.categoria] || o.categoria)}</span><span class="date">Criado em ${fmtDate(o.criado)}</span></div>`;
  $('#bench').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#b-back').focus();
}
function closeBench() {
  $('#bench').hidden = true;
  $('#stage').querySelectorAll('iframe').forEach((f) => f.remove());
  document.body.style.overflow = '';
}
function route() {
  const id = location.hash.slice(1).toUpperCase();
  const o = DATA.find((x) => x.id.toUpperCase() === id);
  if (o) openBench(o); else closeBench();
}

$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.k;
  try { localStorage.setItem('of3d-filter', filter); } catch (err) {}
  renderChips(); renderGrid();
});
$('#q').addEventListener('input', (e) => { query = e.target.value; renderGrid(); });
$('#grid').addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (c) location.hash = c.dataset.id.toLowerCase();
});
$('#b-back').addEventListener('click', () => { location.hash = 'arquivo'; });
$('#b-full').addEventListener('click', () => {
  const s = $('#stage');
  if (s.requestFullscreen) s.requestFullscreen().catch(() => {});
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#bench').hidden && !document.fullscreenElement) location.hash = 'arquivo'; });
window.addEventListener('hashchange', route);

fetch('catalog.json', {cache: 'no-store'})
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((cat) => {
    DATA = (cat.objetos || []).slice().sort((a, b) => b.id.localeCompare(a.id));
    const last = DATA[0];
    $('#s-total').textContent = String(DATA.length).padStart(3, '0');
    $('#s-last').textContent = last ? last.id : '—';
    $('#s-upd').textContent = fmtDate(cat.atualizado);
    renderChips(); renderGrid(); route();
  })
  .catch(() => {
    $('#grid').innerHTML = `<div class="empty">Não consegui carregar o catálogo (catalog.json). Recarregue a página; se continuar, peça ao Claude para republicar a galeria.</div>`;
  });
</script>
